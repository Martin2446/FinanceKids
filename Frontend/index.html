<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Kids - Игра</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="container">
        <div id="game-box">
            <div class="game-header">
                <h2 id="welcome-message">Зареждане на профил...</h2>
            </div>

            <div class="difficulty-section">
                <h3>Изберете трудност:</h3>
                <div class="diff-buttons">
                    <button onclick="loadQuestions('easy')" class="btn-diff easy">Лесно</button>
                    <button onclick="loadQuestions('medium')" class="btn-diff medium">Средно</button>
                    <button onclick="loadQuestions('hard')" class="btn-diff hard">Трудно</button>
                </div>
            </div>

            <div class="badges-section">
                <h3>Твоите Нинджа Значки:</h3>
                <div class="badges-container">
                    <div id="badge-first_points" class="badge locked">
                        <div class="badge-icon">🪙</div>
                        <div class="badge-name">Първа касичка</div>
                        <div class="badge-desc">Събери 10 точки</div>
                    </div>
                    <div id="badge-apprentice" class="badge locked">
                        <div class="badge-icon">🥷</div>
                        <div class="badge-name">Финансов чирак</div>
                        <div class="badge-desc">Събери 50 точки</div>
                    </div>
                    <div id="badge-ninja" class="badge locked">
                        <div class="badge-icon">🐉</div>
                        <div class="badge-name">Финансов нинджа</div>
                        <div class="badge-desc">Събери 100 точки</div>
                    </div>
                    <div id="badge-guru" class="badge locked">
                        <div class="badge-icon">🧠</div>
                        <div class="badge-name">Спестовен гуру</div>
                        <div class="badge-desc">Събери 200 точки</div>
                    </div>
                    <div id="badge-millionaire" class="badge locked">
                        <div class="badge-icon">👑</div>
                        <div class="badge-name">Милионер</div>
                        <div class="badge-desc">Събери 500 точки</div>
                    </div>
                </div>
            </div>

            <div id="quiz-box" style="display: none;">
                <h3 id="question-text">Въпросът ще се зареди тук...</h3>
                <div id="options-container"></div>
                <p id="result"></p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
