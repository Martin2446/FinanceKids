<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Kids - Игра</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="container">
        <div id="game-box">
            <div class="game-header">
                <h2 id="welcome-message">Зареждане на профил...</h2>
            </div>

            <div class="difficulty-section">
                <h3>Изберете трудност:</h3>
                <div class="diff-buttons">
                    <button onclick="loadQuestions('easy')" class="btn-diff easy">Лесно</button>
                    <button onclick="loadQuestions('medium')" class="btn-diff medium">Средно</button>
                    <button onclick="loadQuestions('hard')" class="btn-diff hard">Трудно</button>
                </div>
            </div>

            <div id="quiz-box" style="display: none;">
                <h3 id="question-text">Въпросът ще се зареди тук...</h3>
                <div id="options-container"></div>
                <p id="result"></p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
