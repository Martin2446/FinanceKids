<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Kids - Вход</title>
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div class="container">
        <div id="auth-box">
            <div class="auth-tabs">
                <button id="tab-login-btn" type="button" class="auth-tab-btn active"
                    onclick="switchAuthTab('login')">Вход</button>
                <button id="tab-register-btn" type="button" class="auth-tab-btn"
                    onclick="switchAuthTab('register')">Регистрация</button>
            </div>

            <h2 id="auth-title">Влез в профила си:</h2>
            <input type="text" id="auth-username" placeholder="Потребителско име">
            <input type="password" id="auth-password" placeholder="Парола">

            <button id="auth-submit-btn" type="button" class="btn-submit" onclick="handleAuthSubmit()">Влез</button>
            <button id="auth-guest-btn" type="button" class="btn-guest" onclick="handleGuestLogin()">Влез като Гост</button>
            <p id="auth-error"></p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
